
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<title>TPX HTML SAVER</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
:root{
  --bg:#070b14;
  --card:#101827;
  --line:#26364b;
  --blue:#28c8ff;
  --green:#35e6a0;
  --text:#f0f6ff;
  --muted:#93a4ba;
}
body{
  margin:0;
  min-height:100vh;
  padding:20px 13px;
  background:radial-gradient(ellipse at top,#10243c 0%,var(--bg) 60%);
  color:var(--text);
  font-family:Inter,'Hind Siliguri',sans-serif;
}
.container{max-width:760px;margin:auto}
.header{text-align:center;padding:22px 8px 25px}
.logo{
  width:65px;height:65px;margin:0 auto 15px;
  display:grid;place-items:center;border-radius:20px;
  color:var(--blue);font-size:27px;font-weight:900;
  background:linear-gradient(145deg,#162b42,#0b1220);
  border:1px solid #31516e;
  box-shadow:0 0 30px #28c8ff18;
}
h1{font-size:26px;margin:0;font-weight:800;letter-spacing:1px}
h1 span{color:var(--blue)}
.subtitle{font-size:13px;color:var(--muted);margin-top:10px}
.panel{
  background:linear-gradient(145deg,#111c2c,#0c1320);
  border:1px solid var(--line);border-radius:19px;
  padding:16px;box-shadow:0 15px 40px #0004;
}
.toolbar{
  display:flex;justify-content:space-between;align-items:center;
  gap:8px;flex-wrap:wrap;margin-bottom:13px
}
.label{font-size:14px;font-weight:700}
.status{font-size:11px;color:var(--green)}
textarea{
  display:block;width:100%;height:350px;resize:vertical;
  background:#070c15;color:#c4efff;
  border:1px solid #273a50;border-radius:12px;
  padding:15px;outline:none;
  font:13px/1.7 monospace;
  tab-size:2;
}
textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #28c8ff12}
button{
  border:0;cursor:pointer;border-radius:10px;
  font-family:inherit;font-weight:700;
  padding:12px 14px;transition:.2s;
}
button:active{transform:scale(.97)}
.primary{
  width:100%;margin-top:14px;padding:15px;
  color:#04111a;font-size:15px;
  background:linear-gradient(90deg,#28c8ff,#35e6c0);
  box-shadow:0 5px 22px #28c8ff20;
}
.secondary{background:#1a293b;color:#d8eaff;border:1px solid #30465e;font-size:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.info{
  padding:13px;margin-top:14px;border-radius:10px;
  background:#0a1b20;border:1px solid #17443d;
  color:#9be9d0;font-size:12px;line-height:1.8;
}
.footer{text-align:center;color:#687b93;font-size:11px;padding:22px 0}
#message{font-size:12px;margin-top:12px;text-align:center;min-height:18px}
@media(max-width:420px){
  h1{font-size:22px}
  textarea{height:320px;font-size:12px}
  .panel{padding:12px}
}
</style>
</head>

<body>
<div class="container">

  <header class="header">
    <div class="logo">&lt;/&gt;</div>
    <h1>TPX <span>HTML SAVER</span></h1>
    <div class="subtitle">Write • Paste • Save Your HTML File</div>
  </header>

  <main class="panel">
    <div class="toolbar">
      <div class="label">⌨️ HTML Code Editor</div>
      <div class="status">● READY TO SAVE</div>
    </div>

    <textarea id="code" spellcheck="false"
      placeholder="এখানে তোমার সম্পূর্ণ HTML কোড পেস্ট করো..."></textarea>

    <button class="primary" onclick="saveHTML()">
      ⬇ SAVE AS index.html
    </button>

    <div class="actions">
      <button class="secondary" onclick="clearCode()">🗑 Clear Code</button>
      <button class="secondary" onclick="copyCode()">📋 Copy Code</button>
      <button class="secondary" onclick="loadExample()">🧩 Example HTML</button>
      <button class="secondary" onclick="previewCode()">👁 Preview</button>
    </div>

    <div id="message" role="status"></div>

    <div class="info">
      ✓ ফাইলের নাম: <b>index.html</b><br>
      ✓ HTML, CSS ও JavaScript কোড সেভ হবে<br>
      ✓ কোনো সার্ভারে কোড আপলোড করতে হবে না
    </div>
  </main>

  <div class="footer">POWERED BY TPX HASAN • HTML TO FILE</div>
</div>

<script>
const editor = document.getElementById('code');
const message = document.getElementById('message');

function saveHTML(){
  const html = editor.value;

  if(!html.trim()){
    message.style.color = '#ff8585';
    message.textContent = '⚠️ আগে HTML কোড পেস্ট করো!';
    return;
  }

  const blob = new Blob(
    ['\uFEFF', html],
    {type:'text/html;charset=utf-8'}
  );

  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');

  link.href = url;
  link.download = 'index.html';
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1500);

  message.style.color = '#35e6a0';
  message.textContent = '✅ index.html ফাইল সেভ করার অনুরোধ পাঠানো হয়েছে!';
}

function clearCode(){
  if(!editor.value || confirm('সব কোড মুছে ফেলতে চাও?')){
    editor.value = '';
    message.textContent = 'কোড ক্লিয়ার করা হয়েছে।';
  }
}

async function copyCode(){
  if(!editor.value.trim()){
    message.textContent = 'আগে কিছু কোড লিখো!';
    return;
  }

  try{
    await navigator.clipboard.writeText(editor.value);
    message.style.color = '#35e6a0';
    message.textContent = '✅ কোড কপি হয়েছে!';
  }catch(e){
    editor.select();
    const ok = document.execCommand('copy');
    message.textContent = ok
      ? '✅ কোড কপি হয়েছে!'
      : 'কোড সিলেক্ট হয়েছে, Copy করো।';
  }
}

function loadExample(){
  if(editor.value.trim() &&
     !confirm('বর্তমান কোড বদলে Example HTML বসাবো?')) return;

  editor.value = `<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Website</title>
<style>
body{
  background:#080d18;
  color:#28c8ff;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:50px 15px;
}
</style>
</head>
<body>
<h1>আমার ওয়েবসাইট</h1>
<p>Hello World!</p>
</body>
</html>`;

  message.textContent = 'Example HTML লোড হয়েছে।';
}

function previewCode(){
  if(!editor.value.trim()){
    message.textContent = 'আগে HTML কোড পেস্ট করো!';
    return;
  }

  const blob = new Blob([editor.value], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const tab = window.open(url, '_blank');

  if(!tab){
    message.style.color = '#ffcc66';
    message.textContent = 'Preview ব্লক হয়েছে। Browser popup permission চালু করো।';
  }

  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
</script>
</body>
</html>
